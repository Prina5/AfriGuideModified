<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | AfriGuide AI</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth-style.css">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

    <main class="auth_page">

        <div class="bg_caption">Your passport to Africa, personalised.</div>

        <section class="auth_card">

            <div class="auth_card_head">
                <h1>Sign up for AfriGuide AI</h1>
                <p>Start your adventure. Save places, get smart recommendations, and explore Africa your way.</p>
            </div>

            <!--
                Field names below map onto the User table:
                    first_name / last_name -> combined into users.username
                    email                   -> users.email
                    password                -> hashed server-side into users.password_hash
                confirm_password is validation-only and is NOT sent to the DB.
            -->
            <form id="signupForm" action="http://127.0.0.1:8000/register" method="POST" class="auth_form" novalidate>

                <div class="form_group_row">
                    <div class="form_group">
                        <label for="first_name">First name</label>
                        <input type="text" id="first_name" name="first_name" placeholder="Ama" required
                            autocomplete="given-name">
                    </div>
                    <div class="form_group">
                        <label for="last_name">Last name</label>
                        <input type="text" id="last_name" name="last_name" placeholder="Owusu" required
                            autocomplete="family-name">
                    </div>
                </div>

                <div class="form_group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required
                        autocomplete="email">
                </div>

                <div class="form_group">
                    <label for="password">Password</label>
                    <div class="password_field">
                        <input type="password" id="password" name="password" placeholder="Create a password" required
                            minlength="8" autocomplete="new-password">
                        <button type="button" class="toggle_password" aria-label="Show password" data-target="password">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                    <span class="field_hint">At least 8 characters</span>
                </div>

                <div class="form_group">
                    <label for="confirm_password">Confirm password</label>
                    <div class="password_field">
                        <input type="password" id="confirm_password" name="confirm_password"
                            placeholder="Re-enter your password" required minlength="8" autocomplete="new-password">
                        <button type="button" class="toggle_password" aria-label="Show password"
                            data-target="confirm_password">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                    <span id="passwordMismatch" class="field_hint field_error" hidden>Passwords do not match</span>
                </div>

                <span id="formError" class="field_hint field_error" hidden></span>

                <button type="submit" class="btn auth_submit">
                    Create Account
                </button>

            </form>

            <p class="auth_switch">
                Already have an account? <a href="Afriguidelogin.html">Log in</a>
            </p>

        </section>

    </main>

    <script>
        document.querySelectorAll(".toggle_password").forEach((btn) => {
            btn.addEventListener("click", () => {
                const input = document.getElementById(btn.dataset.target);
                const icon = btn.querySelector("i");
                const isHidden = input.type === "password";
                input.type = isHidden ? "text" : "password";
                icon.className = isHidden ? "ri-eye-off-line" : "ri-eye-line";
                btn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
            });
        });

        const form = document.getElementById("signupForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm_password");
        const mismatchMsg = document.getElementById("passwordMismatch");
        const formError = document.getElementById("formError");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            formError.hidden = true;
            mismatchMsg.hidden = true;

            if (password.value !== confirmPassword.value) {
                mismatchMsg.hidden = false;
                return;
            }

            const firstName = document.getElementById("first_name").value.trim();
            const lastName = document.getElementById("last_name").value.trim();

            const payload = {
                username: `${firstName} ${lastName}`,
                email: document.getElementById("email").value,
                password: password.value
            };

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    formError.textContent = data.detail || "Sign up failed. Please try again.";
                    formError.hidden = false;
                    return;
                }

                const data = await response.json();
                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("username", data.username);

                window.location.href = "Afriguideindex.html";
            } catch (err) {
                formError.textContent = "Could not reach the server. Please try again.";
                formError.hidden = false;
            }
        });
    </script>

</body>

</html>
