<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AfriGuide AI — Chat</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" />

    <style>
        :root {
            --black: #0a0a0b;
            --black-soft: #131315;
            --panel: #101012;
            --white: #ededee;
            --white-dim: #9c9ca0;
            --route: #ff7a33;
            --route-dim: rgba(255, 122, 51, 0.14);
            --line: rgba(255, 255, 255, 0.09);
            --muted: #6c6c70;

            --font-display: "Space Grotesk", sans-serif;
            --font-body: "Inter", sans-serif;
            --font-mono: "IBM Plex Mono", monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: var(--font-body);
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* ============================================================
           SIDEBAR
        ============================================================ */

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: var(--black-soft);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
        }

        .sidebar_top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 6px 22px;
        }

        .sidebar_logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
            color: var(--white);
            text-decoration: none;
        }

        .sidebar_logo .globe {
            font-size: 1.1rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .sidebar_close {
            display: none;
            background: none;
            border: none;
            color: var(--white-dim);
            font-size: 1.25rem;
            cursor: pointer;
        }

        .new_chat_btn {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            width: 100%;
            padding: 11px 14px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--white);
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition:
                background 0.15s ease,
                border-color 0.15s ease;
            margin-bottom: 22px;
        }

        .new_chat_btn:hover {
            background: var(--route-dim);
            border-color: var(--route);
        }

        .sidebar_label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 4px 8px 10px;
        }

        .sidebar_history {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
        }

        .sidebar_history::-webkit-scrollbar {
            width: 5px;
        }

        .sidebar_history::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }

        .history_empty {
            margin: 2px 8px 0;
            padding: 16px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.015);
        }

        .history_empty i {
            font-size: 1.05rem;
            color: var(--route);
            margin-bottom: 6px;
            display: block;
        }

        .history_empty p {
            margin: 0;
            font-size: 0.79rem;
            line-height: 1.5;
            color: var(--white-dim);
        }

        /* ============================================================
           ACCOUNT
        ============================================================ */

        .sidebar_account {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 10px;
            margin-top: 10px;
            border-top: 1px solid var(--line);
        }

        .account_avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white-dim);
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .account_info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .account_name {
            font-size: 0.84rem;
            font-weight: 500;
            color: var(--white);
        }

        .account_sub {
            font-size: 0.71rem;
            color: var(--muted);
        }

        .account_signin {
            background: none;
            border: none;
            color: var(--route);
            font-family: var(--font-body);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            padding: 6px 8px;
        }

        .account_signin:hover {
            text-decoration: underline;
        }

        .sidebar_backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 30;
        }

        .sidebar_backdrop.show {
            display: block;
        }

        /* ============================================================
           MAIN
        ============================================================ */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--black);
            position: relative;
        }

        .mobile_toggle {
            display: none;
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 5;
            background: var(--black-soft);
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--white);
            font-size: 1.1rem;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* ============================================================
           HERO
        ============================================================ */

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px 22px;
            position: relative;
            overflow: hidden;
        }

        .hero_media {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.6s ease;
        }

        #heroVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .hero_media_overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(10, 10, 11, 0.55) 0%,
                    rgba(10, 10, 11, 0.75) 55%,
                    var(--black) 100%);
        }

        .hero_media.stopped {
            opacity: 0;
            pointer-events: none;
        }

        .hero_content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 2.3rem;
            margin: 0 0 10px;
            color: var(--white);
            letter-spacing: -0.02em;
        }

        .hero h1 span {
            color: var(--route);
        }

        .hero p {
            margin: 0 0 30px;
            font-size: 0.98rem;
            color: var(--white-dim);
            max-width: 420px;
            line-height: 1.55;
        }

        .chip_row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 520px;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 15px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--white-dim);
            font-family: var(--font-body);
            font-size: 0.81rem;
            cursor: pointer;
            transition:
                border-color 0.15s ease,
                color 0.15s ease,
                background 0.15s ease;
        }

        .chip i {
            color: var(--route);
            font-size: 0.95rem;
        }

        .chip:hover {
            border-color: var(--route);
            color: var(--white);
            background: var(--route-dim);
        }

        /* ============================================================
           MESSAGES
        ============================================================ */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 60px 26px 10px;
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .messages.show {
            display: flex;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }

        .msg {
            display: flex;
            align-items: flex-end;
            gap: 9px;
            max-width: 70%;
        }

        .msg.bot {
            align-self: flex-start;
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .bubble {
            padding: 11px 14px 9px;
            border-radius: 9px;
            font-size: 0.89rem;
            line-height: 1.5;
        }

        .msg.bot .bubble {
            background: var(--panel);
            border: 1px solid var(--line);
            border-bottom-left-radius: 3px;
            color: var(--white);
        }

        .msg.user .bubble {
            background: var(--white);
            color: var(--black);
            border-bottom-right-radius: 3px;
        }

        .bubble p {
            margin: 0;
            white-space: pre-line;
        }

        /* ============================================================
           THINKING ANIMATION
        ============================================================ */

        .thinking_bubble {
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 38px;
        }

        .thinking_dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--route);
            opacity: 0.45;
            animation: thinkingBounce 1.2s infinite ease-in-out;
        }

        .thinking_dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .thinking_dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes thinkingBounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* ============================================================
           RECOMMENDATION CARDS
        ============================================================ */

        .rec_list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .rec_card {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line);
            border-left: 2px solid var(--route);
            border-radius: 7px;
        }

        .rec_card_head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
        }

        .rec_card_name {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--white);
        }

        .rec_card_match {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--route);
            white-space: nowrap;
        }

        .rec_card_country {
            font-size: 0.78rem;
            color: var(--white-dim);
            margin-top: 2px;
        }

        /* ============================================================
           CHOICES
        ============================================================ */

        .choice_row {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 10px;
        }

        .choice_btn {
            padding: 7px 13px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--white);
            font-family: var(--font-body);
            font-size: 0.8rem;
            cursor: pointer;
            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .choice_btn:hover:not(:disabled) {
            border-color: var(--route);
            background: var(--route-dim);
        }

        .choice_btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .choice_btn.chosen {
            border-color: var(--route);
            background: var(--route-dim);
            color: var(--route);
        }

        /* ============================================================
           INPUT
        ============================================================ */

        .input_wrap {
            padding: 0 26px 30px;
        }

        .input_bar {
            display: flex;
            align-items: flex-end;
            gap: 9px;
            max-width: 640px;
            margin: 0 auto;
            padding: 9px 9px 9px 15px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .input_bar:focus-within {
            border-color: var(--route);
        }

        .icon_btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px;
            flex-shrink: 0;
        }

        .icon_btn:hover {
            color: var(--white);
        }

        .input_bar textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--font-body);
            font-size: 0.89rem;
            color: var(--white);
            line-height: 1.5;
            max-height: 140px;
            padding: 8px 0;
        }

        .input_bar textarea::placeholder {
            color: var(--muted);
        }

        .send_btn {
            width: 36px;
            height: 36px;
            border-radius: 7px;
            border: none;
            background: var(--route);
            color: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            cursor: pointer;
            flex-shrink: 0;
            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .send_btn:hover {
            transform: translateY(-1px);
            background: #ff9457;
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */

        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 40;
                width: 82%;
                max-width: 300px;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar_close {
                display: block;
            }

            .mobile_toggle {
                display: flex;
            }

            .hero {
                padding-top: 60px;
            }

            .hero h1 {
                font-size: 1.75rem;
            }

            .input_wrap {
                padding: 0 14px 8px;
            }

            .messages {
                padding: 60px 14px 10px;
            }

            .msg {
                max-width: 86%;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .sidebar,
            .send_btn {
                transition: none;
            }

            .thinking_dot {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- ============================================================
         SIDEBAR
    ============================================================ -->

        <aside class="sidebar" id="sidebar">

            <div class="sidebar_top">

                <a href="#" class="sidebar_logo">
                    <span class="globe">🌍</span>
                    AFRIGUIDE
                </a>

                <button class="sidebar_close" id="sidebarClose" aria-label="Close sidebar">

                    <i class="ri-close-line"></i>

                </button>

            </div>


            <button class="new_chat_btn" id="newChatBtn">

                <i class="ri-add-line"></i>

                New trip chat

            </button>


            <nav class="sidebar_history" aria-label="Conversation history">

                <span class="sidebar_label">
                    Chats
                </span>


                <div class="history_empty" id="historyEmpty">

                    <i class="ri-map-2-line"></i>

                    <p>
                        No trips planned yet.<br />
                        Start one below and it'll show up here.
                    </p>

                </div>


                <ul class="history_list" id="historyList" style="
                    list-style:none;
                    margin:0;
                    padding:0;
                    display:flex;
                    flex-direction:column;
                    gap:2px;
                ">
                </ul>

            </nav>


            <div class="sidebar_account">

                <div class="account_avatar">
                    <i class="ri-user-3-line"></i>
                </div>


                <div class="account_info">

                    <span class="account_name">
                        User
                    </span>

                    <span class="account_sub">
                        Trips aren't saved yet
                    </span>

                </div>


                <button class="account_signin" id="signInBtn">

                    Sign in

                </button>

            </div>

        </aside>


        <div class="sidebar_backdrop" id="sidebarBackdrop">
        </div>


        <!-- ============================================================
         MAIN
    ============================================================ -->

        <main class="main">

            <button class="mobile_toggle" id="mobileToggle" aria-label="Open sidebar">

                <i class="ri-menu-line"></i>

            </button>


            <!-- ========================================================
             HERO
        ======================================================== -->

            <div class="hero" id="hero">

                <div class="hero_media" id="heroMedia">

                    <video id="heroVideo" autoplay muted playsinline loop preload="auto">

                        <source src="https://res.cloudinary.com/dxyupwm5/video/upload/v1786927347/Video_Project_8_1.mp4"
                            type="video/mp4" />

                    </video>


                    <div class="hero_media_overlay"></div>

                </div>


                <div class="hero_content">

                    <h1>
                        Welcome to
                        <span>AfriGuide</span>
                    </h1>


                    <p>
                        Let's find your next destination.
                        Tell me your budget, how long
                        you're travelling, and the kind
                        of trip you're after.
                    </p>


                    <div class="chip_row">

                        <button class="chip" data-text="I want a beach escape, mid-range budget, about a week.">

                            <i class="ri-sun-line"></i>

                            Beach escape

                        </button>


                        <button class="chip" data-text="Plan a safari adventure for two, moderate budget.">

                            <i class="ri-footprint-line"></i>

                            Safari adventure

                        </button>


                        <button class="chip" data-text="I'd love a trip focused on historic cities and heritage sites.">

                            <i class="ri-ancient-gate-line"></i>

                            Historic cities

                        </button>


                        <button class="chip" data-text="Suggest a budget-friendly solo backpacking route.">

                            <i class="ri-backpack-line"></i>

                            Solo & budget

                        </button>

                    </div>

                </div>

            </div>


            <!-- ========================================================
             MESSAGES
        ======================================================== -->

            <div class="messages" id="messages">
            </div>


            <!-- ========================================================
             INPUT
        ======================================================== -->

            <div class="input_wrap">

                <form class="input_bar" id="chatForm">

                    <button type="button" class="icon_btn" aria-label="Attach file">

                        <i class="ri-attachment-2"></i>

                    </button>


                    <textarea id="chatInput" placeholder="Ask about destinations, budgets, or travel dates..." rows="1"
                        required></textarea>


                    <button type="submit" class="send_btn" aria-label="Send message">

                        <i class="ri-send-plane-fill"></i>

                    </button>

                </form>

            </div>

        </main>

    </div>


    <script>

        /* ================================================================
           SIDEBAR
        ================================================================ */

        const sidebar =
            document.getElementById("sidebar");

        const mobileToggle =
            document.getElementById("mobileToggle");

        const sidebarClose =
            document.getElementById("sidebarClose");

        const sidebarBackdrop =
            document.getElementById("sidebarBackdrop");


        function openSidebar() {

            sidebar.classList.add("open");

            sidebarBackdrop.classList.add("show");
        }


        function closeSidebar() {

            sidebar.classList.remove("open");

            sidebarBackdrop.classList.remove("show");
        }


        mobileToggle.addEventListener(
            "click",
            openSidebar
        );

        sidebarClose.addEventListener(
            "click",
            closeSidebar
        );

        sidebarBackdrop.addEventListener(
            "click",
            closeSidebar
        );


        /* ================================================================
           API
        ================================================================ */

        const API_BASE_URL =
            "http://127.0.0.1:8000";


        function getToken() {

            return localStorage.getItem(
                "access_token"
            );
        }


        /* ================================================================
           ACCOUNT
        ================================================================ */

        (function initAccountArea() {

            const token =
                getToken();

            const username =
                localStorage.getItem(
                    "username"
                );


            const nameEl =
                document.querySelector(
                    ".account_name"
                );

            const subEl =
                document.querySelector(
                    ".account_sub"
                );

            const signInBtn =
                document.getElementById(
                    "signInBtn"
                );


            if (
                token &&
                username
            ) {

                nameEl.textContent =
                    username;

                subEl.textContent =
                    "Signed in";

                signInBtn.textContent =
                    "Log out";


                signInBtn.addEventListener(
                    "click",
                    () => {

                        localStorage.removeItem(
                            "access_token"
                        );

                        localStorage.removeItem(
                            "username"
                        );

                        window.location.href =
                            "Afriguidelogin.html";

                    }
                );

            } else {

                signInBtn.addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "Afriguidelogin.html";

                    }
                );

            }

        })();


        /* ================================================================
           MAIN ELEMENTS
        ================================================================ */

        const hero =
            document.getElementById("hero");

        const heroMedia =
            document.getElementById(
                "heroMedia"
            );

        const messagesEl =
            document.getElementById(
                "messages"
            );

        const chatForm =
            document.getElementById(
                "chatForm"
            );

        const chatInput =
            document.getElementById(
                "chatInput"
            );

        const historyEmpty =
            document.getElementById(
                "historyEmpty"
            );

        const historyList =
            document.getElementById(
                "historyList"
            );

        const heroVideo =
            document.getElementById(
                "heroVideo"
            );


        let videoStopped = false;

        let historyAdded = false;

        let conversationStarted =
            false;

        let questionnaireState =
            null;

        let pendingPreference = {};


        /* ================================================================
           THINKING SYSTEM
        ================================================================ */

        /*
            This is the main thinking system.
        
            Every bot response goes through this function.
        
            The bot will:
        
            1. Show three animated dots.
            2. Wait a few seconds.
            3. Remove the dots.
            4. Display the real response.
        */

        const BOT_THINKING_TIME = 1800;


        function createThinkingIndicator() {

            const wrap =
                document.createElement("div");

            wrap.className =
                "msg bot";

            wrap.id =
                "thinkingIndicator";


            wrap.innerHTML = `

        <div class="bubble thinking_bubble">

            <span class="thinking_dot"></span>

            <span class="thinking_dot"></span>

            <span class="thinking_dot"></span>

        </div>

    `;


            messagesEl.appendChild(wrap);

            messagesEl.scrollTop =
                messagesEl.scrollHeight;


            return wrap;
        }


        /*
            This function makes the bot think first,
            then display its message.
        */

        function botThink(callback, delay = BOT_THINKING_TIME) {

            const indicator =
                createThinkingIndicator();


            setTimeout(() => {

        /* ================================================================
           BUDGET
        ================================================================ */

        function handleBudgetAnswer(
            rawText
        ) {

            const value =
                parseFloat(
                    rawText.replace(
                        /[^0-9.]/g,
                        ""
                    )
                );


            if (
                !value ||
                value <= 0
            ) {

                addBotMessage(
                    "Please enter a valid budget greater than 0, for example $1000."
                );

                return;

            }


            pendingPreference.budget =
                value;


            questionnaireState =
                "duration";


            addBotMessage(
                "Got it! 💰 How many days is the trip? (e.g. 7)"
            );
        }


        /* ================================================================
           DURATION
        ================================================================ */

        function handleDurationAnswer(
            rawText
        ) {

            const value =
                parseInt(
                    rawText.replace(
                        /[^0-9]/g,
                        ""
                    ),
                    10
                );


            if (
                !value ||
                value <= 0
            ) {

                addBotMessage(
                    "Please enter a valid number of days greater than 0, like 7."
                );

                return;

            }


            pendingPreference.duration =
                value;


            questionnaireState =
                "climate";


            addBotMessageWithChoices(

                "What climate are you after? 🌍",

                CLIMATE_CHOICES,

                (climate) => {

                    pendingPreference.climate =
                        climate;

                    questionnaireState =
                        "type";

                    showAdaptiveTypeQuestion(
                        climate
                    );

                }

            );
        }


        /* ================================================================
           TYPE
        ================================================================ */

        function showAdaptiveTypeQuestion(
            climate
        ) {

            const choices =
                TYPE_CHOICES_BY_CLIMATE[
                climate
                ] ||
                TYPE_CHOICES_BY_CLIMATE.Tropical;


            let explanation = "";


            if (
                climate === "Desert"
            ) {

                explanation =
                    "Since you've selected a desert climate 🌵, ";

            }

            else if (
                climate === "Coastal"
            ) {

                explanation =
                    "Since you've selected a coastal climate 🏝️, ";

            }

            else if (
                climate === "Tropical"
            ) {

                explanation =
                    "Since you've selected a tropical climate 🌴, ";

            }

            else if (
                climate === "Temperate"
            ) {

                explanation =
                    "Since you've selected a temperate climate 🌤️, ";

            }


            addBotMessageWithChoices(

                explanation +
                "what kind of experience would you like?",

                choices,

                (type) => {

                    pendingPreference.destination_type =
                        type;

                    questionnaireState =
                        "season";

                    showAdaptiveSeasonQuestion(
                        climate
                    );

                }

            );
        }


        /* ================================================================
           SEASON
        ================================================================ */

        function showAdaptiveSeasonQuestion(
            climate
        ) {

            const choices =
                SEASON_CHOICES_BY_CLIMATE[
                climate
                ] ||
                [
                    {
                        label: "No preference",
                        value: null
                    }
                ];


            addBotMessageWithChoices(

                "Any specific season in mind? This is optional.",

                choices,

                (season) => {

                    pendingPreference.season =
                        season;

                    finishQuestionnaire();

                }

            );
        }


        /* ================================================================
           QUESTIONNAIRE TEXT
        ================================================================ */

        async function handleQuestionnaireAnswer(
            rawText
        ) {

            const text =
                rawText.trim();


            if (
                questionnaireState ===
                "budget"
            ) {

                handleBudgetAnswer(
                    text
                );

                return;
            }


            if (
                questionnaireState ===
                "duration"
            ) {

                handleDurationAnswer(
                    text
                );

                return;
            }


            if (
                questionnaireState ===
                "climate"
            ) {

                const selectedClimate =
                    CLIMATE_CHOICES.find(
                        (choice) =>
                            choice.value
                                .toLowerCase() ===
                            text.toLowerCase()
                    );


                if (!selectedClimate) {

                    addBotMessage(

                        "Please choose one of the available climate options: Tropical, Coastal, Desert, or Temperate."

                    );


                    addBotMessageWithChoices(

                        "What climate are you after? 🌍",

                        CLIMATE_CHOICES,

                        (climate) => {

                            pendingPreference.climate =
                                climate;

                            questionnaireState =
                                "type";

                            showAdaptiveTypeQuestion(
                                climate
                            );

                        },

                        BOT_THINKING_TIME + 300

                    );


                    return;
                }


                pendingPreference.climate =
                    selectedClimate.value;


                questionnaireState =
                    "type";


                showAdaptiveTypeQuestion(
                    selectedClimate.value
                );


                return;
            }


            if (
                questionnaireState ===
                "type"
            ) {

                const climate =
                    pendingPreference.climate;


                const validChoices =
                    TYPE_CHOICES_BY_CLIMATE[
                    climate
                    ] || [];


                const selectedType =
                    validChoices.find(
                        (choice) =>
                            choice.value
                                .toLowerCase() ===
                            text.toLowerCase()
                    );


                if (!selectedType) {

                    const validNames =
                        validChoices
                            .map(
                                (choice) =>
                                    choice.label
                            )
                            .join(", ");


                    addBotMessage(

                        `"${text}" doesn't match the ${climate.toLowerCase()} climate you selected. 😊 Please choose one of these options: ${validNames}.`

                    );


                    setTimeout(
                        () => {

                            showAdaptiveTypeQuestion(
                                climate
                            );

                        },
                        BOT_THINKING_TIME + 300
                    );


                    return;
                }


                pendingPreference.destination_type =
                    selectedType.value;


                questionnaireState =
                    "season";


                showAdaptiveSeasonQuestion(
                    climate
                );


                return;
            }


            if (
                questionnaireState ===
                "season"
            ) {

                const climate =
                    pendingPreference.climate;


                const validChoices =
                    SEASON_CHOICES_BY_CLIMATE[
                    climate
                    ] || [];


                const selectedSeason =
                    validChoices.find(
                        (choice) =>
                            choice.value &&
                            choice.value
                                .toLowerCase() ===
                            text.toLowerCase()
                    );


                if (
                    text.toLowerCase() ===
                    "skip" ||
                    text.toLowerCase() ===
                    "no preference"
                ) {

                    pendingPreference.season =
                        null;

                    finishQuestionnaire();

                    return;
                }


                if (!selectedSeason) {

                    addBotMessage(
                        "Please choose one of the available season options, or select 'No preference'."
                    );


                    setTimeout(
                        () => {

                            showAdaptiveSeasonQuestion(
                                climate
                            );

                        },
                        BOT_THINKING_TIME + 300
                    );


                    return;
                }


                pendingPreference.season =
                    selectedSeason.value;


                finishQuestionnaire();

            }

        }


        /* ================================================================
           FINISH QUESTIONNAIRE
        ================================================================ */

        async function finishQuestionnaire() {

            questionnaireState =
                null;


            const token =
                getToken();


            if (!token) {

                addBotLoginPrompt(

                    "Your preferences are ready! Please log in or sign up so I can save them and generate your personalized recommendations."

                );

                return;
            }


            /*
                Show thinking while the backend
                is processing the recommendation.
            */

            const indicator =
                createThinkingIndicator();


            try {

                console.log(
                    "Sending preferences:",
                    pendingPreference
                );


                /* --------------------------------------------------------
                   SAVE PREFERENCES
                -------------------------------------------------------- */

                const prefResponse =
                    await fetch(
                        `${API_BASE_URL}/preferences`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                Authorization:
                                    `Bearer ${token}`

                            },

                            body:
                                JSON.stringify(
                                    pendingPreference
                                )

                        }
                    );


                if (!prefResponse.ok) {

                    indicator?.remove();


                    const errData =
                        await prefResponse
                            .json()
                            .catch(
                                () => ({})
                            );


                    const detail =
                        Array.isArray(
                            errData.detail
                        )

                            ? errData.detail
                                .map(
                                    (e) => e.msg
                                )
                                .join(", ")

                            : errData.detail ||
                            "Could not save your preferences.";


                    addBotMessage(
                        detail
                    );


                    return;
                }


                /* --------------------------------------------------------
                   REQUEST RECOMMENDATION
                -------------------------------------------------------- */

                const recResponse =
                    await fetch(
                        `${API_BASE_URL}/recommend`,
                        {

                            method: "POST",

                            headers: {

                                Authorization:
                                    `Bearer ${token}`

                            }

                        }
                    );


                indicator?.remove();


                if (!recResponse.ok) {

                    const errData =
                        await recResponse
                            .json()
                            .catch(
                                () => ({})
                            );


                    console.error(
                        "Recommendation error:",
                        errData
                    );


                    addBotMessage(

                        "I saved your preferences successfully, but I couldn't generate your recommendations right now. Please check that your recommendation endpoint and model are running correctly."

                    );


                    return;
                }


                const recData =
                    await recResponse.json();


                if (
                    !recData.recommendations ||
                    recData.recommendations.length === 0
                ) {

                    addBotMessage(

                        "I couldn't find a suitable destination for those preferences. Try adjusting your budget, duration, climate, or interests."

                    );


                    return;
                }


                const topNames =
                    recData.recommendations
                        .slice(0, 3)
                        .map(
                            (r) =>
                                r.destination
                        )
                        .join(", ");


                addBotMessageWithRecommendations(

                    `Perfect! 🌍 Based on your budget, trip duration, ${pendingPreference.climate.toLowerCase()} climate, and ${pendingPreference.destination_type.toLowerCase()} interest, I recommend: ${topNames}.`,

                    recData.recommendations

                );

            }

            catch (err) {

                console.error(
                    "Recommendation request failed:",
                    err
                );


                indicator?.remove();


                addBotMessage(

                    "I saved your preferences, but I couldn't reach the recommendation server. Please make sure your FastAPI backend is running and try again."

                );

            }

        }

                    );

                            ? text.slice(0, 34) + "…"

                    text,
                    "user"
                );


                chatInput.value =
                    "";

                chatInput.style.height =
                    "auto";


                /* ========================================================
                   READY STAGE
                ======================================================== */

                if (
                    questionnaireState ===
                    null

                    const lower =
                        text

                            .trim();


                    if (
                        lower === "ready" ||

                            "yes, ready"

                            window.innerWidth <= 900
                        ) {

                            closeSidebar();

                        }


                        return;
                    }


                    if (
                        lower.includes(
                            "not ready"
                        ) ||
                        lower.includes(
                            "no"
                        ) ||
                        lower.includes(
                            "later"
                        ) ||
                        lower.includes(
                            "wait"
                        ) ||
                        lower.includes(
                            "maybe"
                        )
                    ) {

                        addBotMessage(

                            "No problem! 😊 Take your time. Just say \"ready\" whenever you're ready. I'm here to assist."

                        );


                        if (
                            window.innerWidth <= 900
                        ) {

                            closeSidebar();

                        }


                        return;
                    }


                    addBotMessage(

                        "I'm here to help you plan an African trip. 😊 Let's focus on finding a destination that matches your preferences. When you're ready, just say \"ready\" and we'll begin."

                    );


                    if (
                        window.innerWidth <= 900
                    ) {

                        closeSidebar();

                    }


                    return;
                }


                /* ========================================================
                   QUESTIONNAIRE
                ======================================================== */

                if (
                    questionnaireState !== null
                ) {

                    await handleQuestionnaireAnswer(
                        text
                    );


                    if (
                        window.innerWidth <= 900
                    ) {

                        closeSidebar();

                    }


                    return;
                }


                /* ========================================================
                   AFTER RECOMMENDATION
                ======================================================== */

                const indicator =
                    createThinkingIndicator();


                try {

                    const headers = {

                        "Content-Type":
                            "application/json"

                    };


                    const token =
                        getToken();


                    if (token) {

                        headers[
                            "Authorization"
                        ] =
                            `Bearer ${token}`;

                    }


                    const response =
                        await fetch(
                            `${API_BASE_URL}/chat`,
                            {

                                method: "POST",

                                headers,

                                body:
                                    JSON.stringify({
                                        message:
                                            text
                                    })

                            }
                        );


                    indicator?.remove();


                    if (!response.ok) {

                        addBotMessage(

                            "Something went wrong reaching AfriGuide AI. Please try again."

                        );

                        return;
                    }


                    const data =
                        await response.json();


                    if (
                        data.needs_login
                    ) {

                        addBotLoginPrompt(
                            data.response
                        );

                    }

                    else if (
                        data.needs_preferences
                    ) {

                        addBotMessage(
                            data.response
                        );


                        setTimeout(
                            () => {

                                startQuestionnaire();

                            },
                            BOT_THINKING_TIME + 300
                        );

                    }

                    else {

                        addBotMessageWithRecommendations(

                            data.response,

                            data.recommendations

                        );

                    }

                }

                catch (err) {

                    console.error(
                        "Chat request error:",
                        err
                    );


                    indicator?.remove();


                    addBotMessage(

                        "Could not reach the server. Please check that your FastAPI backend is running and try again."

                    );

                }


                if (
                    window.innerWidth <= 900
                ) {

                    closeSidebar();

                }

            }
        );


        /* ================================================================
           NEW CHAT
        ================================================================ */

        document
            .getElementById(
                "newChatBtn"
            )
            .addEventListener(
                "click",
                () => {

                    messagesEl.innerHTML =
                        "";

                    messagesEl.classList.remove(
                        "show"
                    );

                    hero.style.display =
                        "flex";


                    conversationStarted =
                        false;

                    questionnaireState =
                        null;

                    pendingPreference =
                        {};

                    historyAdded =
                        false;


                    videoStopped =
                        false;

                    heroMedia.classList.remove(
                        "stopped"
                    );


                    heroVideo.currentTime =
                        0;

                    heroVideo
                        .play()
                        .catch(
                            () => { }
                        );


                    if (
                        window.innerWidth <= 900
                    ) {

                        closeSidebar();

                    }

                }
            );

    </script>

</body>

</html>
